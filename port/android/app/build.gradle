plugins {
    id "com.android.application"
}

def githubRunNumber = System.getenv("GITHUB_RUN_NUMBER")
def automaticVersionCode = githubRunNumber ? (100000 + githubRunNumber.toInteger()).toString() : "3"
def automaticVersionName = githubRunNumber ? "0.0." + githubRunNumber : "0.0.3"
def khcomVersionCode = (System.getenv("KHCOM_VERSION_CODE") ?: automaticVersionCode).toInteger()
def khcomVersionName = System.getenv("KHCOM_VERSION_NAME") ?: automaticVersionName
def khcomSigningStore = System.getenv("KHCOM_SIGNING_STORE_FILE")
def khcomSigningStorePassword = System.getenv("KHCOM_SIGNING_STORE_PASSWORD") ?: "android"
def khcomSigningKeyAlias = System.getenv("KHCOM_SIGNING_KEY_ALIAS") ?: "androiddebugkey"
def khcomSigningKeyPassword = System.getenv("KHCOM_SIGNING_KEY_PASSWORD") ?: "android"

android {
    namespace "com.narmanb.khcomandroid"
    compileSdk 36

    defaultConfig {
        applicationId "com.narmanb.khcomandroid"
        minSdk 23
        targetSdk 36
        versionCode khcomVersionCode
        versionName khcomVersionName

        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    // Keep signing material out of git. When a preserved keystore is supplied,
    // debug APKs use it so test builds remain update-compatible with one another.
    signingConfigs {
        khcomUpdate {
            if (khcomSigningStore) {
                storeFile file(khcomSigningStore)
                storePassword khcomSigningStorePassword
                keyAlias khcomSigningKeyAlias
                keyPassword khcomSigningKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (khcomSigningStore) {
                signingConfig signingConfigs.khcomUpdate
            }
        }
    }

    // ROM restoration leaves large zero-filled data sections in the library.
    // Compress it in the APK and let Android extract it at installation.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += [rootProject.file("../../build/android/us/package/jniLibs")]
            assets.srcDirs += [rootProject.file("../../build/android/us/package/assets")]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
