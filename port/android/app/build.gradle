plugins {
    id "com.android.application"
}

android {
    namespace "com.narmanb.khcomandroid"
    compileSdk 36

    defaultConfig {
        applicationId "com.narmanb.khcomandroid"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "0.0.2"

        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    // ROM restoration leaves large zero-filled data sections in the library.
    // Compress it in the APK and let Android extract it at installation.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += [rootProject.file("../../build/android/us/package/jniLibs")]
            assets.srcDirs += [rootProject.file("../../build/android/us/package/assets")]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
