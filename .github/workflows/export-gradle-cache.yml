name: Export Android Gradle cache

on:
  push:
    branches:
      - android-port
    paths:
      - .github/workflows/export-gradle-cache.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Resolve Android Gradle plugin
        working-directory: port/android
        run: gradle --stacktrace :app:tasks
      - name: Package Gradle cache
        run: |
          set -euxo pipefail
          tar -C "$HOME/.gradle" -czf "$RUNNER_TEMP/android-gradle-cache.tgz" caches
      - uses: actions/upload-artifact@v4
        with:
          name: android-gradle-cache
          path: ${{ runner.temp }}/android-gradle-cache.tgz
          retention-days: 1
          compression-level: 0
