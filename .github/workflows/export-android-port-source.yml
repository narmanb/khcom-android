name: Export Android port source
# refresh current source for Gradle rebuild

on:
  push:
    branches:
      - android-port
    paths:
      - .github/workflows/export-android-port-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android port
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Archive source tree
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/khcom-android-source.tar.gz" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: khcom-android-source
          path: ${{ runner.temp }}/khcom-android-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
