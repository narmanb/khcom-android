name: Export Android port source

on:
  push:
    branches:
      - android-port
    paths:
      - .github/workflows/export-android-port-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android port
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Archive source tree
        run: |
          tar             --exclude=.git             --exclude='build*'             --exclude=roms             -czf khcom-android-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: khcom-android-source
          path: khcom-android-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
